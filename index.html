<!DOCTYPE html>
<html lang="rw">
<head>
  <button onclick="installApp()">Download App</button>
<script src="app.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVortex Dynamics - Tech & Repairs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-900 text-white font-sans">

  <!-- Header Section -->
  <header class="p-6 bg-slate-800 border-b border-slate-700 text-center">
    <h1 class="text-3xl font-bold text-blue-500">Nexura Dynamics</h1>
    <p class="text-slate-400 text-sm mt-1">Software Development, Hardware Repair & Electronics</p>
  </header>

  <!-- Hero / Call to Action -->
  <main class="max-w-4xl mx-auto p-4">
    <div class="bg-blue-600 rounded-lg p-6 text-center my-6 shadow-lg">
      <h2 class="text-xl font-bold mb-2">Gusana Laptop, Telefone no Kwubaka Apps</h2>
      <p class="text-sm mb-4">Tukorera k mu mugi wa Kigali. Shakisha serivisi wifuza mu nsi!</p>
      <a href="https://wa.me/+250794483657" class="inline-block bg-green-500 hover:bg-green-600 font-bold py-2 px-6 rounded-full text-white transition">
        📱 chat on WhatsApp
      </a>
    </div>

    <!-- Dynamic Services Section -->
    <h3 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3">Serivisi Zacu n'Ibiciro</h3>
    
    <div id="services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-slate-400">Irimo gukura serivisi muri Google Sheets...</p>
    </div>
  </main>

  <script>
    // Replace with your exact SheetDB API URL
    const SHEETDB_URL = "https://sheetdb.io/api/v1/2jspwf73hj56e";

    fetch(SHEETDB_URL)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('services-container');
        container.innerHTML = ''; // Clear loading text

        data.forEach(service => {
          container.innerHTML += `
            <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 hover:border-blue-500 transition">
              <span class="text-xs bg-blue-900 text-blue-300 font-semibold px-2.5 py-0.5 rounded">${service.Category || 'General'}</span>
              <h4 class="text-lg font-bold mt-2 text-white">${service.Izina_Serivisi || service.Service_Name}</h4>
              <p class="text-slate-400 text-sm mt-1">${service.Ibisobanuro || service.Description}</p>
              <div class="mt-4 flex justify-between items-center">
                <span class="text-green-400 font-bold">${service.Igiciro_RFW || service.Estimated_Price_RWF} RWF</span>
                <a href="https://wa.me/250780000000?text=Ndashaka%20serivisi%20ya%20${encodeURIComponent(service.Izina_Serivisi || service.Service_Name)}" 
                   class="text-xs bg-slate-700 hover:bg-blue-600 text-white py-1.5 px-3 rounded">
                   Saba Serivisi
                </a>
              </div>
            </div>
          `;
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('services-container').innerHTML = '<p class="text-red-400">Habaye ikosa mu gukura data!</p>';
      });
  </script>
</body>
</html>
