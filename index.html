<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexura Dynamics - Tech & Repairs</title>

  <!-- External Styles & Scripts -->
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <script src="app.js" defer></script>
</head>

<body class="bg-slate-900 text-white font-sans">

  <!-- Header Section -->
  <header class="p-6 bg-slate-800 border-b border-slate-700 text-center relative">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-3xl font-bold text-blue-500">Nexura Dynamics</h1>
        <p class="text-slate-400 text-sm mt-1">Software Development, Hardware Repair & Electronics</p>
      </div>
      <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition" onclick="installApp()">
        Download App
      </button>
    </div>
  </header>

  <!-- Hero / Call to Action -->
  <main class="max-w-4xl mx-auto p-4">
    <div class="bg-blue-600 rounded-lg p-6 text-center my-6 shadow-lg">
      <h2 class="text-xl font-bold mb-2">Repair Laptop, mobile phones and develop your business app or website</h2>
      <p class="text-sm mb-4">Search down your choice then enjoy!</p>
      <a href="https://wa.me/+250794483657" class="inline-block bg-green-500 hover:bg-green-600 font-bold py-2 px-6 rounded-full text-white transition">
        📱 chat on WhatsApp
      </a>
    </div>

    <!-- Live Search Bar -->
    <div class="mb-6">
      <label for="search-input" class="sr-only">Search Services</label>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Shakisha serivisi (e.g. Laptop, Phone, App)..." 
        class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 transition"
        onkeyup="filterServices()"
      />
    </div>

    <!-- Dynamic Services Section -->
    <h3 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3">Serivisi Zacu n'Ibiciro</h3>
    
    <div id="services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-slate-400 col-span-full text-center">Irimo gukura serivisi muri Google Sheets...</p>
    </div>
  </main>

  <script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/2jspwf73hj56e";
    let allServices = [];

    // Fetch Services
    fetch(SHEETDB_URL)
      .then(res => res.json())
      .then(data => {
        allServices = data;
        renderServices(allServices);
      })
      .catch(err => {
        console.error("SheetDB Fetch Error:", err);
        document.getElementById('services-container').innerHTML = `
          <p class="text-red-400 col-span-full text-center">Habaye ikosa mu gukura data! Nyamuneka gerageza n'ubundi.</p>
        `;
      });

    // Render Cards Function
    function renderServices(services) {
      const container = document.getElementById('services-container');
      
      if (services.length === 0) {
        container.innerHTML = `<p class="text-slate-400 col-span-full text-center">Nta serivisi ibonetse matching search yako.</p>`;
        return;
      }

      container.innerHTML = services.map(service => {
        // Fallbacks for variable names to avoid `undefined`
        const title = service.Izina_Serivisi || service.Service_Name || service.Name || service.Title || 'Serivisi';
        const description = service.Ibisobanuro || service.Description || service.Details || 'Nta bisobanuro bihari.';
        const category = service.Category || service.Icyiciro || 'General';
        const price = service.Igiciro_RFW || service.Estimated_Price_RWF || service.Price || '---';

        return `
          <div class="service-card bg-slate-800 p-5 rounded-lg border border-slate-700 hover:border-blue-500 transition flex flex-col justify-between">
            <div>
              <span class="text-xs bg-blue-900 text-blue-300 font-semibold px-2.5 py-0.5 rounded">${category}</span>
              <h4 class="text-lg font-bold mt-2 text-white">${title}</h4>
              <p class="text-slate-400 text-sm mt-1">${description}</p>
            </div>
            <div class="mt-4 flex justify-between items-center">
              <span class="text-green-400 font-bold">${price} RWF</span>
              <a href="https://wa.me/250794483657?text=Ndashaka%20serivisi%20ya%20${encodeURIComponent(title)}" 
                 target="_blank"
                 class="text-xs bg-slate-700 hover:bg-blue-600 text-white py-1.5 px-3 rounded transition">
                 Saba Serivisi
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Live Search Filter
    function filterServices() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allServices.filter(service => {
        const title = (service.Izina_Serivisi || service.Service_Name || service.Name || service.Title || '').toLowerCase();
        const desc = (service.Ibisobanuro || service.Description || service.Details || '').toLowerCase();
        const cat = (service.Category || service.Icyiciro || '').toLowerCase();

        return title.includes(query) || desc.includes(query) || cat.includes(query);
      });
      renderServices(filtered);
    }
  </script>
</body>
</html>
